[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqeval"
version = "0.1.0"
description = "Evaluate gridded air-quality model output against monitoring stations: grid matching, time-offset detection, daily statistics, figures and a data catalogue."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ibuki Terada" }]
requires-python = ">=3.10"
dependencies = ["numpy", "pandas>=2.1"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest", "matplotlib"]

[project.urls]
Repository = "https://github.com/tevet2005/air-quality-model-evaluation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
